<!DOCTYPE html>
<html>
<head>
  <title>StreakKeeper — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">StreakKeeper</h1>
    <div class="flex gap-4">
      <a href="/export/csv" class="text-sm text-gray-600 hover:text-gray-900">Export</a>
      <a href="/logout" class="text-sm text-gray-600 hover:text-gray-900">Logout</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-8">
    <h2 class="text-2xl font-bold mb-6">Today's habits</h2>

    <form action="/habits/new" method="POST" class="mb-8 flex gap-2">
      <input type="text" name="name" placeholder="New habit (e.g., meditate)" required
             class="flex-1 px-4 py-2 border rounded">
      <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded">Add</button>
    </form>

    {% if habits %}
      <ul class="space-y-3">
        {% for habit in habits %}
          <li class="bg-white border rounded p-4 flex justify-between items-center">
            <div>
              <div class="font-medium">{{ habit.name }}</div>
              <div class="text-sm text-gray-500">{{ habit.current_streak }} day streak</div>
            </div>
            <form action="/habits/{{ habit.id }}/complete" method="POST">
              <button type="submit" class="px-4 py-1 bg-green-600 text-white text-sm rounded">
                Mark done
              </button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-gray-500 text-center py-12">
        No habits yet. Add your first one above.
      </p>
    {% endif %}
  </main>
</body>
</html>

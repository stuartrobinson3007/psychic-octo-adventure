<!DOCTYPE html>
<html>
<head>
  <title>StreakKeeper — Sign up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white border rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">Start your streak</h1>

    <form method="POST" class="space-y-4">
      <input type="email" name="email" placeholder="Email" required
             class="w-full px-4 py-2 border rounded">
      <input type="password" name="password" placeholder="Password" required
             class="w-full px-4 py-2 border rounded">
      <button type="submit" class="w-full px-4 py-2 bg-purple-600 text-white rounded">
        Create account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account? <a href="/login" class="text-purple-600">Log in</a>
    </p>
  </div>
</body>
</html>
